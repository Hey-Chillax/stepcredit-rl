- name: hotpotqa_agent
  _target_: recipes.hotpotqa.hotpotqa_agent_flow.HotpotQAAgentFlow
  max_steps: 5
  max_parallel_calls: 4
  force_first_search: true

  # BGE checkpoint. Must match `env/build_index.py --embedding_model`.
  embedding_model_name: ${oc.env:HOTPOTQA_EMBEDDING_MODEL,BAAI/bge-large-en-v1.5}
  # Retrieval corpus/index root. This is separate from train/validation parquet data.
  corpus_data_dir: ${oc.env:HOTPOTQA_CORPUS_DATA_ROOT,data/corpus/hotpotqa_corpus}
  # null: use HOTPOTQA_EMBEDDING_DEVICE (default cpu), or per-worker cuda:i
  # if HOTPOTQA_EMBEDDING_PER_WORKER_GPU=1.
  embedding_devices: null
  enable_tool_parse_feedback: true

  # Reward shaping of a trajectory's last step. All zero keeps the plain exact-match reward from reward_fn.py.
  # Validation always reports exact match as `acc`, so the evaluation metric stays separate from the training reward.
  # f1_weight: partial credit for a wrong answer, times its token F1 against the ground truth.
  # evidence_weight: partial credit for a wrong answer when the retrieved passages contain the ground truth.
  # repeat_penalty: cost per repeated search query, up to repeat_penalty_cap queries.
  f1_weight: ${oc.env:HOTPOTQA_F1_WEIGHT,0.0}
  evidence_weight: ${oc.env:HOTPOTQA_EVIDENCE_WEIGHT,0.0}
  repeat_penalty: ${oc.env:HOTPOTQA_REPEAT_PENALTY,0.0}
  repeat_penalty_cap: 4
